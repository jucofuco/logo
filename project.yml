name: logo
options:
  bundleIdPrefix: com.jucofuco
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 48K54VWKU7
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  # ONNX Runtime for the Supertonic 3 voice (same package the upstream iOS example uses).
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager.git
    from: 1.20.0
targets:
  logo:
    type: application
    platform: iOS
    sources:
      - logo
      # Supertonic model, filled by Scripts/fetch_model.sh. Missing folder makes generate fail on purpose.
      - path: Model
        type: folder
        buildPhase: resources
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    info:
      path: logo/Info.plist
      properties:
        # Launch screen in the theme background, so it blends into the loading screen.
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jucofuco.logo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon # Scripts/make_icon.py
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: logo
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
