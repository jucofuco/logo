<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6E56CF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="logo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<title>logo</title>
</head>
<body>
<div id="app">
  <section class="strip card">
    <div id="chips" class="chips"></div>
    <button id="undo" class="icon-btn" aria-label="Delete last">⌫</button>
  </section>
  <button id="speak" class="speak"><span id="speak-icon">🔊</span> Speak</button>
  <main id="page" class="page"></main>
  <div id="banner" class="banner card" hidden></div>
</div>

<dialog id="forms" class="sheet">
  <h2 id="forms-title">Form</h2>
  <div id="forms-list" class="list"></div>
  <button class="done" data-close>Cancel</button>
</dialog>

<dialog id="settings" class="sheet">
  <h2>Settings</h2>
  <div id="settings-body"></div>
  <button class="done" data-close>Done</button>
</dialog>

<noscript>This app needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
